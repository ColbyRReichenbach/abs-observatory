name: Live MLB Data Polling

on:
  schedule:
    # GitHub Actions schedules are static and UTC-based.
    # We keep a 5-minute heartbeat here and let the ET-aware poll gate
    # decide whether there are live MLB games worth ingesting.
    - cron: '*/5 * * * *'
  
  # Manual trigger from GitHub "Actions" tab
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ETL Requirements
        run: pip install -r etl/requirements.txt

      - name: Poll Live Games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: true
          MLB_GAME_TYPES: S,R
          WRITE_RAW_SNAPSHOTS: true
          WRITE_RAW_FEED_LIVE: false
          WRITE_RAW_STANDINGS: false
          WRITE_RAW_SAVANT: false
        run: |
          python3 etl/poll_live_window.py

      - name: Prune Source Snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 etl/prune_source_snapshots.py \
            --feed-live-days 14 \
            --standings-days 0 \
            --savant-days 0
