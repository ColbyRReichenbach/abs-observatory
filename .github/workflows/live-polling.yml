name: Live MLB Data Polling

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  
  # Manual trigger from GitHub "Actions" tab
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ETL Requirements
        run: pip install -r etl/requirements.txt

      - name: Poll Live Games
        env:
          WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
          DATABASE_SSL: true
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          
          python3 etl/ingest_mlb_abs.py \
            --start-date $TODAY \
            --end-date $TODAY \
            --game-type S,R \
            --skip-final-existing
