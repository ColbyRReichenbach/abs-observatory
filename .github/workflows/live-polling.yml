name: Live MLB Data Polling

on:
  schedule:
    # GitHub Actions schedules are static and UTC-based.
    # We keep a 5-minute heartbeat here and let the ET-aware poll gate
    # decide whether there are live MLB games worth ingesting.
    - cron: '*/5 * * * *'
  
  # Manual trigger from GitHub "Actions" tab
  workflow_dispatch:

concurrency:
  group: live-polling-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-etl:
    name: Poll Warehouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ETL Requirements
        run: pip install -r etl/requirements.txt

      - name: Poll Live Games
        env:
          WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
          DATABASE_SSL: true
          MLB_GAME_TYPES: S,R
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          python3 etl/ingest_mlb_abs.py \
            --start-date $TODAY \
            --end-date $TODAY \
            --game-type S,R \
            --skip-final-existing

      - name: Prune Source Snapshots
        env:
          DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
        run: |
          python3 etl/prune_source_snapshots.py \
            --feed-live-days 14 \
            --standings-days 0 \
            --savant-days 0

  publish-serving:
    name: Publish Serving
    runs-on: ubuntu-latest
    needs:
      - run-etl
    if: ${{ needs.run-etl.result == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Reconcile Warehouse vs Serving
        env:
          WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
          SERVING_DATABASE_URL: ${{ secrets.SERVING_DATABASE_URL }}
        run: npm run db:reconcile:warehouse-serving

      - name: Publish Warehouse to Serving
        env:
          WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
          SERVING_DATABASE_URL: ${{ secrets.SERVING_DATABASE_URL }}
        run: npm run db:publish:serving
