name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - backend
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, and unit/integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abs_observatory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abs_observatory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abs_observatory
      DATABASE_SSL: "false"
      OPENAI_API_KEY: test-openai-key
      OPENAI_QUERY_MODEL: gpt-4.1-mini
      OPENAI_SUMMARY_MODEL: gpt-4.1-mini
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_test_placeholder
      ACTIVE_POLL_SECONDS: "30"
      IDLE_POLL_SECONDS: "120"
      INTERNAL_WORKER_TOKEN: ci-worker-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run db:schema

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  etl:
    name: ETL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abs_observatory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abs_observatory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abs_observatory
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply database schema
        run: bash scripts/run-db-schema.sh

      - name: Run ETL tests
        run: npm run etl:test

  ai-evals:
    name: AI evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abs_observatory
      DATABASE_SSL: "false"
      OPENAI_API_KEY: test-openai-key
      OPENAI_QUERY_MODEL: gpt-4.1-mini
      OPENAI_SUMMARY_MODEL: gpt-4.1-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI evals
        run: npm run test:ai-evals

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abs_observatory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abs_observatory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abs_observatory
      DATABASE_SSL: "false"
      OPENAI_API_KEY: test-openai-key
      OPENAI_QUERY_MODEL: gpt-4.1-mini
      OPENAI_SUMMARY_MODEL: gpt-4.1-mini
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_test_placeholder
      INTERNAL_WORKER_TOKEN: ci-worker-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply database schema
        run: npm run db:schema

      - name: Run end-to-end tests
        run: npm run test:e2e
